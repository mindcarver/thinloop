name: Thinloop Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Check version surfaces, tag, and notes
        run: node scripts/check-version.mjs --tag "$GITHUB_REF_NAME" --require-release-notes

      - name: Confirm tag commit belongs to main
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - name: Run repository tests
        run: node --test tests/*.test.mjs

      - name: Check routing kernel surfaces
        run: node scripts/sync-routing-kernel.mjs --check

      - name: Validate evaluation definitions
        run: |
          node evals/validate-discovery-cases.mjs
          node evals/validate-knowledge-cases.mjs
          node evals/knowledge/validate.mjs
          node evals/thinloop/validate.mjs

      - name: Run Knowledge dry-run
        run: node evals/knowledge/runner/run.mjs --mode dry

      - name: Run Thinloop current evaluation dry-run
        run: node evals/thinloop/runner/run.mjs --mode dry

      - name: Check README diagrams
        run: node scripts/generate-readme-diagrams.mjs --check

      - name: Validate Claude plugin
        run: npm exec --yes --package=@anthropic-ai/claude-code@2.1.197 -- claude plugin validate . --strict

  release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out exact tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Recheck exact release notes
        run: node scripts/check-version.mjs --tag "$GITHUB_REF_NAME" --require-release-notes

      - name: Create release from exact tag notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Thinloop ${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
