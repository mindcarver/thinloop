  <path d="M 54 236 H 1146" stroke="#6f7453" stroke-width="2" stroke-dasharray="4 8" opacity="0.7"/>
  <circle cx="54" cy="236" r="5" fill="#c55c2f"/>
  <circle cx="1146" cy="236" r="5" fill="#c55c2f"/>
