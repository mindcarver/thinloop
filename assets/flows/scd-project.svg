        <tspan x="369" dy="20">切片</tspan>
      </text>
    </g>
<path d="M 694 167 H 731" fill="none" stroke="#c55c2f" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <rect x="512" y="126" width="172" height="82" rx="8" fill="#17313b" stroke="#17313b" stroke-width="2"/>
      <circle cx="536" cy="148" r="13" fill="#f8edcf" stroke="#c55c2f" stroke-width="2"/>
