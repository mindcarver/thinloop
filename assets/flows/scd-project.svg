      <text x="598" y="168" fill="#f8edcf" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', ui-monospace, monospace" font-size="15" font-weight="800" letter-spacing="0.8">
        <tspan x="598" dy="0">依赖</tspan>
        <tspan x="598" dy="20">图</tspan>
      </text>
    </g>
<path d="M 923 167 H 960" fill="none" stroke="#c55c2f" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <rect x="741" y="126" width="172" height="82" rx="8" fill="#4f7773" stroke="#17313b" stroke-width="2"/>
      <circle cx="765" cy="148" r="13" fill="#f8edcf" stroke="#c55c2f" stroke-width="2"/>
      <text x="765" y="153" fill="#17313b" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', ui-monospace, monospace" font-size="11" font-weight="800">04</text>
      <text x="827" y="168" fill="#f8edcf" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', ui-monospace, monospace" font-size="15" font-weight="800" letter-spacing="0.8">
        <tspan x="827" dy="0">就绪</tspan>
        <tspan x="827" dy="20">校验</tspan>
      </text>
    </g>

    <g>
      <rect x="970" y="126" width="172" height="82" rx="8" fill="#c55c2f" stroke="#17313b" stroke-width="2"/>
      <circle cx="994" cy="148" r="13" fill="#f8edcf" stroke="#c55c2f" stroke-width="2"/>
      <text x="994" y="153" fill="#17313b" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', ui-monospace, monospace" font-size="11" font-weight="800">05</text>
      <text x="1056" y="168" fill="#f8edcf" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', ui-monospace, monospace" font-size="15" font-weight="800" letter-spacing="0.8">
        <tspan x="1056" dy="0">任务单</tspan>
