<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">SCD 项目拆解</title>
  <desc id="desc">多交付目标 → 可执行任务图</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#17313b" stroke-width="0.55" opacity="0.1"/>
    </pattern>
    <filter id="paperNoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.08"/></feComponentTransfer>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c55c2f"/>
    </marker>
  </defs>
  <rect width="1200" height="280" rx="18" fill="#f2e4bd"/>
  <rect width="1200" height="280" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="280" rx="18" filter="url(#paperNoise)" opacity="0.8"/>
  <rect x="12" y="12" width="1176" height="256" rx="12" fill="none" stroke="#17313b" stroke-width="2"/>
  <path d="M 18 44 H 30 M 24 38 V 50 M 1170 44 H 1182 M 1176 38 V 50" stroke="#c55c2f" stroke-width="2"/>
  <rect x="34" y="30" width="82" height="30" rx="15" fill="#17313b"/>
  <text x="75" y="51" fill="#f8edcf" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', ui-monospace, monospace" font-size="14" font-weight="700">流程 04</text>
  <text x="132" y="49" fill="#17313b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', ui-monospace, monospace" font-size="25" font-weight="800" letter-spacing="1.2">SCD 项目拆解</text>
  <text x="1166" y="48" fill="#4f7773" text-anchor="end" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="1.4">多交付目标 → 可执行任务图</text>
  <line x1="34" y1="76" x2="1166" y2="76" stroke="#17313b" stroke-width="1.5" opacity="0.55"/>
  <path d="M 236 167 H 273" fill="none" stroke="#c55c2f" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <rect x="54" y="126" width="172" height="82" rx="8" fill="#17313b" stroke="#17313b" stroke-width="2"/>
      <circle cx="78" cy="148" r="13" fill="#f8edcf" stroke="#c55c2f" stroke-width="2"/>
      <text x="78" y="153" fill="#17313b" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', ui-monospace, monospace" font-size="11" font-weight="800">01</text>
      <text x="140" y="168" fill="#f8edcf" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', ui-monospace, monospace" font-size="15" font-weight="800" letter-spacing="0.8">
        <tspan x="140" dy="0">项目</tspan>
        <tspan x="140" dy="20">核心</tspan>
      </text>
    </g>
<path d="M 465 167 H 502" fill="none" stroke="#c55c2f" stroke-width="3" marker-end="url(#arrow)"/>
